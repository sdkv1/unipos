<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi - UniPOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="js/shared.js?v=1.0.7"></script>
    <script defer src="js/transactions.js?v=1.0.7"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', secondary: '#8b5cf6', accent: '#06b6d4', success: '#10b981', danger: '#ef4444', warning: '#f59e0b', dark: '#1e293b' } } } };
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-in { animation: toastIn 0.3s ease; }
        @media print { .no-print { display: none !important; } }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

    <!-- Mobile overlay -->
    <div x-data="{ sidebarOpen: false }" @keydown.escape.window="sidebarOpen = false">
        <div x-show="sidebarOpen" @click="sidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-black/50 z-40 lg:hidden"></div>

        <!-- Sidebar -->
        <aside class="fixed left-0 top-0 h-full w-64 bg-dark text-white z-50 transform transition-transform duration-300 lg:translate-x-0"
               :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
            <div class="p-6 border-b border-gray-700 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center">
                        <i class="fas fa-cash-register text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight">UniPOS</h1>
                        <p class="text-xs text-gray-400">Universal POS</p>
                    </div>
                </div>
                <button @click="sidebarOpen = false" class="lg:hidden text-gray-400 hover:text-white">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <nav class="p-4 space-y-1">

                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
                    <i class="fas fa-chart-line w-5 text-center"></i>
                    <span class="font-medium">Dashboard</span>
                </a>
                <a href="pos.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
                    <i class="fas fa-shopping-cart w-5 text-center"></i>
                    <span class="font-medium">Kasir</span>
                </a>
                <a href="products.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
                    <i class="fas fa-box w-5 text-center"></i>
                    <span class="font-medium">Produk</span>
                </a>
                <a href="transactions.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                    <i class="fas fa-receipt w-5 text-center"></i>
                    <span class="font-medium">Transaksi</span>
                </a>
                <a href="reports.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
                    <i class="fas fa-chart-bar w-5 text-center"></i>
                    <span class="font-medium">Laporan</span>
                </a>
                <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
                    <i class="fas fa-cog w-5 text-center"></i>
                    <span class="font-medium">Pengaturan</span>
                </a>
            </nav>
            <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-700">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-accent to-primary flex items-center justify-center">
                        <i class="fas fa-user text-white text-xs"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium truncate" id="storeNameSidebar">Toko Saya</p>
                        <p class="text-xs text-gray-500">Admin • v<span x-text="$store.app?.version || ''"></span></p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="lg:ml-64 min-h-screen">
            <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-200 px-6 py-4 flex items-center justify-between no-print">
                <div class="flex items-center gap-4">
                    <button @click="sidebarOpen = true" class="lg:hidden p-2 rounded-lg hover:bg-gray-200">
                        <i class="fas fa-bars text-gray-600"></i>
                    </button>
                    <div class="flex items-center gap-2 text-gray-500">
                        <i class="fas fa-store"></i>
                        <span class="font-medium" id="storeNameTopbar">Toko Saya</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:flex items-center gap-2 text-sm text-gray-500 bg-white px-3 py-1.5 rounded-lg border">
                        <i class="fas fa-clock"></i>
                        <span id="liveClock">--</span>
                    </div>
                    <button onclick="exportAll()" class="p-2 rounded-lg hover:bg-gray-200 text-gray-600" title="Export Data">
                        <i class="fas fa-download"></i>
                    </button>
                </div>
            </header>

            <div class="p-6">

                <div x-data="transactionsApp()" x-init="init()">
                    <div class="mb-6">
                        <h2 class="text-2xl font-bold text-gray-800">Riwayat Transaksi</h2>
                        <p class="text-gray-500">Semua transaksi penjualan</p>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-4 border-b flex flex-col sm:flex-row gap-3">
                            <div class="relative flex-1 max-w-md">
                                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" x-model="search" placeholder="Cari transaksi..."
                                       class="w-full pl-12 pr-4 py-2.5 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
                            </div>
                            <input type="date" x-model="dateFilter" class="px-4 py-2.5 rounded-xl border border-gray-200 focus:border-indigo-500 outline-none">
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">ID</th>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Waktu</th>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Item</th>
                                        <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Total</th>
                                        <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Bayar</th>
                                        <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Kembalian</th>
                                        <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    <template x-for="tx in filtered" :key="tx.id">
                                        <tr class="hover:bg-gray-50 cursor-pointer" @click="show(tx)">
                                            <td class="px-4 py-3 text-sm font-mono font-medium" x-text="'#' + tx.id"></td>
                                            <td class="px-4 py-3 text-sm text-gray-600" x-text="tx.date + ' ' + tx.time"></td>
                                            <td class="px-4 py-3 text-sm" x-text="tx.items.length + ' item'"></td>
                                            <td class="px-4 py-3 text-right text-sm font-bold" x-text="fmt.rupiah(tx.total)"></td>
                                            <td class="px-4 py-3 text-right text-sm" x-text="fmt.rupiah(tx.paid)"></td>
                                            <td class="px-4 py-3 text-right text-sm text-emerald-600" x-text="fmt.rupiah(tx.change)"></td>
                                            <td class="px-4 py-3 text-center">
                                                <button class="w-8 h-8 rounded-lg hover:bg-indigo-50 text-indigo-500"><i class="fas fa-eye text-sm"></i></button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                            <p x-show="!filtered.length" class="text-gray-400 text-center py-12">Tidak ada transaksi</p>
                        </div>
                    </div>

                    <!-- Detail Modal -->
                    <div x-show="detailOpen" x-transition.opacity x-transition.opacity class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                        <div @click.away="detailOpen = false" class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
                            <div class="p-6 border-b flex items-center justify-between">
                                <h3 class="font-bold text-lg"><i class="fas fa-receipt text-indigo-500 mr-2"></i>Detail Transaksi</h3>
                                <button @click="detailOpen = false" class="w-8 h-8 rounded-lg hover:bg-gray-100"><i class="fas fa-times text-gray-500"></i></button>
                            </div>
                            <div class="p-6" x-show="selected">
                                <div class="text-center mb-4">
                                    <h4 class="font-bold text-xl" x-text="settings.storeName || 'Toko Saya'"></h4>
                                    <p class="text-sm text-gray-500" x-text="settings.address"></p>
                                    <div class="mt-2 inline-block px-3 py-1 rounded-full bg-gray-100 text-sm font-mono" x-text="'#' + selected.id"></div>
                                    <p class="text-sm text-gray-500" x-text="selected.date + ' ' + selected.time"></p>
                                </div>
                                <div class="space-y-2 mb-4">
                                    <template x-for="item in selected.items" :key="item.id">
                                        <div class="flex justify-between py-2 border-b border-gray-100">
                                            <div>
                                                <p class="font-medium" x-text="item.name"></p>
                                                <p class="text-sm text-gray-500" x-text="item.qty + ' x ' + fmt.rupiah(item.price)"></p>
                                            </div>
                                            <span class="font-medium" x-text="fmt.rupiah(item.qty * item.price)"></span>
                                        </div>
                                    </template>
                                </div>
                                <div class="space-y-2 pt-2 border-t-2">
                                    <div class="flex justify-between"><span class="text-gray-500">Subtotal</span><span x-text="fmt.rupiah(selected.subtotal)"></span></div>
                                    <div class="flex justify-between"><span class="text-gray-500">Diskon</span><span class="text-red-500" x-text="fmt.rupiah(selected.discount)"></span></div>
                                    <div class="flex justify-between text-lg font-bold"><span>TOTAL</span><span x-text="fmt.rupiah(selected.total)"></span></div>
                                    <div class="flex justify-between pt-2 border-t"><span class="text-gray-500">Bayar</span><span x-text="fmt.rupiah(selected.paid)"></span></div>
                                    <div class="flex justify-between"><span class="text-gray-500">Kembalian</span><span class="text-emerald-600 font-medium" x-text="fmt.rupiah(selected.change)"></span></div>
                                </div>
                            </div>
                            <div class="p-6 border-t flex justify-end gap-3 no-print">
                                <button @click="detailOpen = false" class="px-5 py-2.5 rounded-xl border hover:bg-gray-50">Tutup</button>
                                <button @click="window.print()" class="px-5 py-2.5 rounded-xl bg-indigo-500 text-white hover:bg-indigo-600"><i class="fas fa-print mr-1"></i> Cetak</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
        // Live clock
        function updateClock() {
            const el = document.getElementById('liveClock');
            if (el) el.textContent = new Date().toLocaleString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Sync store name
        const settings = DB.get('settings', {});
        if (settings.storeName) {
            document.getElementById('storeNameTopbar').textContent = settings.storeName;
            document.getElementById('storeNameSidebar').textContent = settings.storeName;
        }
        });
    </script>
</body>
</html>
