<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=dashboard.html">
    <title>UniPOS - Universal Point of Sale</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; }
        .loader { text-align: center; }
        .spinner { width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { color: #1e293b; margin: 0 0 8px; }
        p { color: #64748b; margin: 0; }
        a { color: #6366f1; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h1>UniPOS</h1>
        <p>Memuat aplikasi... <a href="dashboard.html">Klik di sini</a> jika tidak redirect.</p>
    </div>
</body>
</html>
