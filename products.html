<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - UniPOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', secondary: '#8b5cf6', accent: '#06b6d4', success: '#10b981', danger: '#ef4444', warning: '#f59e0b', dark: '#1e293b' } } } };
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-in { animation: toastIn 0.3s ease; }
        @media print { .no-print { display: none !important; } }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

    <!-- Mobile overlay -->
    <div x-data="{ sidebarOpen: false }" @keydown.escape.window="sidebarOpen = false">
        <div x-show="sidebarOpen" @click="sidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-black/50 z-40 lg:hidden"></div>

        <!-- Sidebar -->
        <aside class="fixed left-0 top-0 h-full w-64 bg-dark text-white z-50 transform transition-transform duration-300 lg:translate-x-0"
               :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
            <div class="p-6 border-b border-gray-700 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center">
                        <i class="fas fa-cash-register text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight">UniPOS</h1>
                        <p class="text-xs text-gray-400">Universal POS</p>
                    </div>
                </div>
                <button @click="sidebarOpen = false" class="lg:hidden text-gray-400 hover:text-white">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <nav class="p-4 space-y-1">

                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
                    <i class="fas fa-chart-line w-5 text-center"></i>
                    <span class="font-medium">Dashboard</span>
                </a>
                <a href="pos.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
                    <i class="fas fa-shopping-cart w-5 text-center"></i>
                    <span class="font-medium">Kasir</span>
                </a>
                <a href="products.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                    <i class="fas fa-box w-5 text-center"></i>
                    <span class="font-medium">Produk</span>
                </a>
                <a href="transactions.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
                    <i class="fas fa-receipt w-5 text-center"></i>
                    <span class="font-medium">Transaksi</span>
                </a>
                <a href="reports.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
                    <i class="fas fa-chart-bar w-5 text-center"></i>
                    <span class="font-medium">Laporan</span>
                </a>
                <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-gray-400 hover:bg-gray-800 hover:text-white">
                    <i class="fas fa-cog w-5 text-center"></i>
                    <span class="font-medium">Pengaturan</span>
                </a>
            </nav>
            <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-700">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-accent to-primary flex items-center justify-center">
                        <i class="fas fa-user text-white text-xs"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium truncate" id="storeNameSidebar">Toko Saya</p>
                        <p class="text-xs text-gray-500">Admin • v<span id="appVersion"></span></p>
                    </div>
                </div>
                <p class="text-xs text-gray-600 mt-2 text-center">UniPOS v1.0.2</p>
            </div>
        </aside>

        <!-- Main -->
        <main class="lg:ml-64 min-h-screen">
            <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-200 px-6 py-4 flex items-center justify-between no-print">
                <div class="flex items-center gap-4">
                    <button @click="sidebarOpen = true" class="lg:hidden p-2 rounded-lg hover:bg-gray-200">
                        <i class="fas fa-bars text-gray-600"></i>
                    </button>
                    <div class="flex items-center gap-2 text-gray-500">
                        <i class="fas fa-store"></i>
                        <span class="font-medium" id="storeNameTopbar">Toko Saya</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:flex items-center gap-2 text-sm text-gray-500 bg-white px-3 py-1.5 rounded-lg border">
                        <i class="fas fa-clock"></i>
                        <span id="liveClock">--</span>
                    </div>
                    <button onclick="exportAll()" class="p-2 rounded-lg hover:bg-gray-200 text-gray-600" title="Export Data">
                        <i class="fas fa-download"></i>
                    </button>
                </div>
            </header>

            <div class="p-6">

                <div x-data="productsApp()" x-init="init()">
                    <div class="mb-6">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">Manajemen Produk</h2>
                            <p class="text-gray-500">Kelola daftar produk toko</p>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-4 border-b">
                            <div class="relative max-w-md">
                                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" x-model="search" placeholder="Cari produk..."
                                       class="w-full pl-12 pr-4 py-2.5 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Kode</th>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Nama</th>
                                        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Kategori</th>
                                        <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Harga Beli</th>
                                        <th class="px-4 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Harga Jual</th>
                                        <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">Stok</th>
                                        <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    <template x-for="p in filtered" :key="p.id">
                                        <tr class="hover:bg-gray-50">
                                            <td class="px-4 py-3 text-sm font-mono text-gray-600" x-text="p.code"></td>
                                            <td class="px-4 py-3 font-medium text-sm" x-text="p.name"></td>
                                            <td class="px-4 py-3"><span class="px-2 py-1 rounded-lg text-xs bg-gray-100 text-gray-600" x-text="p.category || '-'"></span></td>
                                            <td class="px-4 py-3 text-right text-sm" x-text="fmt.rupiah(p.buyPrice)"></td>
                                            <td class="px-4 py-3 text-right text-sm font-medium" x-text="fmt.rupiah(p.sellPrice)"></td>
                                            <td class="px-4 py-3 text-center">
                                                <span class="px-2 py-1 rounded-lg text-xs font-medium" :class="p.stock > 10 ? 'bg-emerald-100 text-emerald-600' : p.stock > 0 ? 'bg-amber-100 text-amber-600' : 'bg-red-100 text-red-600'" x-text="p.stock"></span>
                                            </td>
                                            <td class="px-4 py-3 text-center">
                                                <button @click="edit(p)" class="w-8 h-8 rounded-lg hover:bg-indigo-50 text-indigo-500"><i class="fas fa-edit text-sm"></i></button>
                                                <button @click="del(p.id)" class="w-8 h-8 rounded-lg hover:bg-red-50 text-red-500"><i class="fas fa-trash text-sm"></i></button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                            <p x-show="!filtered.length" class="text-gray-400 text-center py-12">Tidak ada produk</p>
                        </div>
                    </div>

                    <!-- FAB -->
                    <button @click="openModal()"
                            class="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white shadow-lg shadow-indigo-500/30 hover:shadow-xl hover:shadow-indigo-500/40 hover:scale-110 transition-all flex items-center justify-center"
                            title="Tambah Produk">
                        <i class="fas fa-plus text-xl"></i>
                    </button>

                    <!-- Modal Tambah / Edit Produk -->
                    <div x-show="modalOpen" x-cloak
                         class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                        <div @click.away="modalOpen = false" class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
                            <div class="p-6 border-b flex items-center justify-between">
                                <h3 class="font-bold text-lg" x-text="editing ? 'Edit Produk' : 'Tambah Produk'"></h3>
                                <button @click="modalOpen = false" class="w-8 h-8 rounded-lg hover:bg-gray-100"><i class="fas fa-times text-gray-500"></i></button>
                            </div>
                            <div class="p-6 space-y-4">
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">Kode Produk *</label><input type="text" x-model="form.code" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">Nama Produk *</label><input type="text" x-model="form.name" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none"></div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">Kategori</label><input type="text" x-model="form.category" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none"></div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Harga Beli *</label><input type="number" x-model.number="form.buyPrice" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none"></div>
                                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Harga Jual *</label><input type="number" x-model.number="form.sellPrice" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none"></div>
                                </div>
                                <div><label class="block text-sm font-medium text-gray-700 mb-1">Stok *</label><input type="number" x-model.number="form.stock" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none"></div>
                            </div>
                            <div class="p-6 border-t flex justify-end gap-3">
                                <button @click="modalOpen = false" class="px-5 py-2.5 rounded-xl border hover:bg-gray-50">Batal</button>
                                <button @click="save()" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-medium hover:opacity-90"><i class="fas fa-save mr-1"></i> Simpan</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="js/shared.js?v=1.0.4"></script>
    <script>
        // Live clock
        function updateClock() {
            const el = document.getElementById('liveClock');
            if (el) el.textContent = new Date().toLocaleString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Sync store name
        const settings = DB.get('settings', {});
        if (settings.storeName) {
            document.getElementById('storeNameTopbar').textContent = settings.storeName;
            document.getElementById('storeNameSidebar').textContent = settings.storeName;
        }
        document.getElementById('appVersion').textContent = APP_VERSION;
    </script>
    <script src="js/products.js?v=1.0.4"></script>
</body>
</html>
