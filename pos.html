<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir - UniPOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="js/shared.js?v=1.0.8"></script>
    <script defer src="js/pos.js?v=1.0.8"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', secondary: '#8b5cf6', accent: '#06b6d4', success: '#10b981', danger: '#ef4444', warning: '#f59e0b', dark: '#1e293b', ink: '#17140f', brass: '#b8752a', brasslight: '#dd9b4e', paper: '#efeae1', mute: '#948c7a' }, fontFamily: { display: ['Manrope','sans-serif'], body: ['Inter','sans-serif'] } } } };
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-in { animation: toastIn 0.3s ease; }
        @media print { .no-print { display: none !important; } }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body class="bg-gray-100 text-gray-800 font-body antialiased">

    <!-- Mobile overlay -->
    <div x-data="{ sidebarOpen: false }" @keydown.escape.window="sidebarOpen = false">
        <div x-show="sidebarOpen" @click="sidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-black/50 z-40 lg:hidden"></div>

        <!-- Sidebar -->
        <aside class="fixed left-0 top-0 h-full w-64 bg-ink text-paper z-50 transform transition-transform duration-300 lg:translate-x-0 flex flex-col"
               :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
            <div class="px-5 pt-6 pb-5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brasslight to-brass flex items-center justify-center shrink-0 shadow-lg shadow-brass/20">
                        <i class="fas fa-cash-register text-ink text-sm"></i>
                    </div>
                    <div class="leading-none">
                        <div class="font-display font-extrabold text-[17px] tracking-tight text-paper">UniPOS</div>
                        <div class="text-[11px] text-mute mt-1">Kasir &amp; Toko</div>
                    </div>
                </div>
                <button @click="sidebarOpen = false" class="lg:hidden text-mute hover:text-paper">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="h-px bg-white/[0.08] mx-5"></div>

            <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto scrollbar-hide">
                <a href="dashboard.html" class="group flex items-center gap-3 pl-3.5 pr-3 py-2.5 rounded-lg text-mute hover:text-paper hover:bg-white/[0.04] transition-colors">
                    <i class="fas fa-chart-line w-4 text-center text-[13px]"></i>
                    <span class="text-[13.5px] font-medium">Dashboard</span>
                </a>
                <a href="pos.html" class="group flex items-center gap-3 pl-3.5 pr-3 py-2.5 rounded-lg relative text-paper bg-white/[0.06]">
                    <span class="absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-5 bg-brasslight rounded-full"></span>
                    <i class="fas fa-cash-register w-4 text-center text-brasslight text-[13px]"></i>
                    <span class="text-[13.5px] font-medium">Kasir</span>
                </a>
                <a href="products.html" class="group flex items-center gap-3 pl-3.5 pr-3 py-2.5 rounded-lg text-mute hover:text-paper hover:bg-white/[0.04] transition-colors">
                    <i class="fas fa-box w-4 text-center text-[13px]"></i>
                    <span class="text-[13.5px] font-medium">Produk</span>
                </a>
                <a href="transactions.html" class="group flex items-center gap-3 pl-3.5 pr-3 py-2.5 rounded-lg text-mute hover:text-paper hover:bg-white/[0.04] transition-colors">
                    <i class="fas fa-receipt w-4 text-center text-[13px]"></i>
                    <span class="text-[13.5px] font-medium">Transaksi</span>
                </a>
                <a href="reports.html" class="group flex items-center gap-3 pl-3.5 pr-3 py-2.5 rounded-lg text-mute hover:text-paper hover:bg-white/[0.04] transition-colors">
                    <i class="fas fa-chart-bar w-4 text-center text-[13px]"></i>
                    <span class="text-[13.5px] font-medium">Laporan</span>
                </a>
                <a href="settings.html" class="group flex items-center gap-3 pl-3.5 pr-3 py-2.5 rounded-lg text-mute hover:text-paper hover:bg-white/[0.04] transition-colors">
                    <i class="fas fa-cog w-4 text-center text-[13px]"></i>
                    <span class="text-[13.5px] font-medium">Pengaturan</span>
                </a>
            </nav>

            <div class="h-px bg-white/[0.08] mx-5"></div>

            <div class="px-5 py-4">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-white/[0.06] border border-white/10 flex items-center justify-center shrink-0">
                        <i class="fas fa-store text-brasslight text-[11px]"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[13px] font-semibold text-paper truncate leading-tight" id="storeNameSidebar">Toko Saya</p>
                        <p class="text-[11px] text-mute leading-tight">Admin</p>
                    </div>
                    <span class="text-[10px] text-mute font-mono shrink-0 px-1.5 py-0.5 rounded bg-white/[0.05]">v1.0.8</span>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="lg:ml-64 min-h-screen">
            <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-200 px-6 py-4 flex items-center justify-between no-print">
                <div class="flex items-center gap-4">
                    <button @click="sidebarOpen = true" class="lg:hidden p-2 rounded-lg hover:bg-gray-200">
                        <i class="fas fa-bars text-gray-600"></i>
                    </button>
                    <div class="flex items-center gap-2 text-gray-500">
                        <i class="fas fa-store"></i>
                        <span class="font-medium" id="storeNameTopbar">Toko Saya</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:flex items-center gap-2 text-sm text-gray-500 bg-white px-3 py-1.5 rounded-lg border">
                        <i class="fas fa-clock"></i>
                        <span id="liveClock">--</span>
                    </div>
                    <button onclick="exportAll()" class="p-2 rounded-lg hover:bg-gray-200 text-gray-600" title="Export Data">
                        <i class="fas fa-download"></i>
                    </button>
                </div>
            </header>

            <div class="p-6">

                <div x-data="posApp()" x-init="init()">
                    <div class="mb-6">
                        <h2 class="text-2xl font-bold text-gray-800">Kasir</h2>
                        <p class="text-gray-500">Proses penjualan cepat</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Product Grid -->
                        <div class="lg:col-span-2 space-y-4">
                            <div class="relative">
                                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                <input type="text" x-model="search" placeholder="Cari produk (nama atau kode)..."
                                       class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3" x-show="filtered.length">
                                <template x-for="p in filtered" :key="p.id">
                                    <div @click="add(p)"
                                         class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 cursor-pointer hover:shadow-md hover:border-indigo-300 transition-all group">
                                        <div class="w-full h-20 rounded-lg bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center mb-3 group-hover:from-indigo-50 group-hover:to-purple-50">
                                            <i class="fas fa-box text-2xl text-gray-300 group-hover:text-indigo-400 transition-colors"></i>
                                        </div>
                                        <p class="font-medium text-sm truncate" x-text="p.name"></p>
                                        <p class="text-xs text-gray-500 mb-1" x-text="p.code"></p>
                                        <div class="flex items-center justify-between">
                                            <span class="font-bold text-indigo-600 text-sm" x-text="fmt.rupiah(p.sellPrice)"></span>
                                            <span class="text-xs px-2 py-0.5 rounded-full" :class="p.stock > 0 ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'" x-text="p.stock + ' stok'"></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <p x-show="!filtered.length && products.length" class="text-gray-400 text-center py-12">Produk tidak ditemukan</p>
                            <p x-show="!products.length" class="text-gray-400 text-center py-12">Belum ada produk. <a href="products.html" class="text-indigo-500 hover:underline">Tambah produk</a></p>
                        </div>

                        <!-- Cart -->
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col h-fit sticky top-24">
                            <div class="p-4 border-b">
                                <h3 class="font-bold flex items-center gap-2">
                                    <i class="fas fa-shopping-cart text-indigo-500"></i> Keranjang
                                    <span x-show="cart.length" class="ml-auto bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-full" x-text="cart.length + ' item'"></span>
                                </h3>
                            </div>
                            <div class="flex-1 max-h-80 overflow-y-auto p-4 space-y-3 scrollbar-hide" x-show="cart.length">
                                <template x-for="(item, i) in cart" :key="i">
                                    <div class="flex items-center gap-3 p-3 rounded-xl bg-gray-50">
                                        <div class="flex-1 min-w-0">
                                            <p class="font-medium text-sm truncate" x-text="item.name"></p>
                                            <p class="text-xs text-gray-500" x-text="fmt.rupiah(item.price) + ' / pcs'"></p>
                                        </div>
                                        <div class="flex items-center gap-1">
                                            <button @click="qty(i, -1)" class="w-7 h-7 rounded-lg bg-white border hover:bg-gray-100 flex items-center justify-center"><i class="fas fa-minus text-xs"></i></button>
                                            <span class="w-7 text-center font-medium text-sm" x-text="item.qty"></span>
                                            <button @click="qty(i, 1)" class="w-7 h-7 rounded-lg bg-white border hover:bg-gray-100 flex items-center justify-center"><i class="fas fa-plus text-xs"></i></button>
                                        </div>
                                        <div class="text-right min-w-[70px]">
                                            <p class="font-bold text-sm" x-text="fmt.rupiah(item.price * item.qty)"></p>
                                            <button @click="remove(i)" class="text-red-500 text-xs hover:underline">Hapus</button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <p x-show="!cart.length" class="text-gray-400 text-center py-8">Keranjang kosong</p>

                            <div class="p-4 border-t space-y-2">
                                <div class="flex justify-between text-sm"><span class="text-gray-500">Subtotal</span><span class="font-medium" x-text="fmt.rupiah(subtotal)"></span></div>
                                <div class="flex justify-between text-sm"><span class="text-gray-500">Diskon</span><span class="font-medium text-red-500" x-text="'- ' + fmt.rupiah(discount)"></span></div>
                                <div class="flex justify-between text-lg font-bold pt-2 border-t"><span>TOTAL</span><span class="text-indigo-600" x-text="fmt.rupiah(total)"></span></div>
                            </div>
                            <div class="p-4 pt-0 grid grid-cols-2 gap-2">
                                <button @click="clear()" class="py-3 rounded-xl border border-gray-200 text-gray-600 font-medium hover:bg-gray-50"><i class="fas fa-trash mr-1"></i> Bersihkan</button>
                                <button @click="openPay()" :disabled="!cart.length" class="py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-medium hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed"><i class="fas fa-credit-card mr-1"></i> Bayar</button>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Modal -->
                    <div x-show="payOpen" x-transition.opacity x-transition.opacity class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                        <div @click.away="payOpen = false" class="bg-white rounded-2xl shadow-xl w-full max-w-md">
                            <div class="p-6 border-b flex items-center justify-between">
                                <h3 class="font-bold text-lg"><i class="fas fa-credit-card text-indigo-500 mr-2"></i>Pembayaran</h3>
                                <button @click="payOpen = false" class="w-8 h-8 rounded-lg hover:bg-gray-100"><i class="fas fa-times text-gray-500"></i></button>
                            </div>
                            <div class="p-6 space-y-4">
                                <div class="p-4 rounded-xl bg-gray-50 space-y-2">
                                    <div class="flex justify-between"><span class="text-gray-500">Total Belanja</span><span class="font-bold" x-text="fmt.rupiah(total)"></span></div>
                                    <div class="flex justify-between"><span class="text-gray-500">Diskon</span><span class="font-medium text-red-500" x-text="fmt.rupiah(discount)"></span></div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Jumlah Bayar *</label>
                                    <input type="number" x-model.number="paid" @input="calcChange()" placeholder="0"
                                           class="w-full px-4 py-3 text-lg rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none text-right font-bold">
                                </div>
                                <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-center">
                                    <p class="text-sm text-gray-500 mb-1">Kembalian</p>
                                    <p class="text-3xl font-bold text-emerald-600" x-text="fmt.rupiah(change)"></p>
                                </div>
                            </div>
                            <div class="p-6 border-t flex justify-end gap-3">
                                <button @click="payOpen = false" class="px-5 py-2.5 rounded-xl border hover:bg-gray-50">Batal</button>
                                <button @click="process()" :disabled="paid < total" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-white font-medium hover:opacity-90 disabled:opacity-50"><i class="fas fa-check mr-1"></i> Proses</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
        // Live clock
        function updateClock() {
            const el = document.getElementById('liveClock');
            if (el) el.textContent = new Date().toLocaleString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Sync store name
        const settings = DB.get('settings', {});
        if (settings.storeName) {
            document.getElementById('storeNameTopbar').textContent = settings.storeName;
            document.getElementById('storeNameSidebar').textContent = settings.storeName;
        }
        });
    </script>
</body>
</html>
