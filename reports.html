<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan - UniPOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="js/shared.js?v=1.0.8"></script>
    <script defer src="js/reports.js?v=1.0.8"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#6366f1', secondary: '#8b5cf6', accent: '#06b6d4', success: '#10b981', danger: '#ef4444', warning: '#f59e0b', dark: '#1e293b', ink: '#17140f', brass: '#b8752a', brasslight: '#dd9b4e', paper: '#efeae1', mute: '#948c7a' }, fontFamily: { display: ['Manrope','sans-serif'], body: ['Inter','sans-serif'] } } } };
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-in { animation: toastIn 0.3s ease; }
        @media print { .no-print { display: none !important; } }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body class="bg-gray-100 text-gray-800 font-body antialiased">

    <!-- Mobile overlay -->
    <div x-data="{ sidebarOpen: false }" @keydown.escape.window="sidebarOpen = false">
        <div x-show="sidebarOpen" @click="sidebarOpen = false" x-transition.opacity class="fixed inset-0 bg-black/50 z-40 lg:hidden"></div>

        <!-- Sidebar -->
        <aside class="fixed left-0 top-0 h-full w-64 bg-ink text-paper z-50 transform transition-transform duration-300 lg:translate-x-0 flex flex-col"
               :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
            <div class="px-5 pt-6 pb-5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brasslight to-brass flex items-center justify-center shrink-0 shadow-lg shadow-brass/20">
                        <i class="fas fa-cash-register text-ink text-sm"></i>
                    </div>
                    <div class="leading-none">
                        <div class="font-display font-extrabold text-[17px] tracking-tight text-paper">UniPOS</div>
                        <div class="text-[11px] text-mute mt-1">Kasir &amp; Toko</div>
                    </div>
                </div>
                <button @click="sidebarOpen = false" class="lg:hidden text-mute hover:text-paper">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="h-px bg-white/[0.08] mx-5"></div>

            <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto scrollbar-hide">
                <a href="dashboard.html" class="group flex items-center gap-3 pl-3.5 pr-3 py-2.5 rounded-lg text-mute hover:text-paper hover:bg-white/[0.04] transition-colors">
                    <i class="fas fa-chart-line w-4 text-center text-[13px]"></i>
                    <span class="text-[13.5px] font-medium">Dashboard</span>
                </a>
                <a href="pos.html" class="group flex items-center gap-3 pl-3.5 pr-3 py-2.5 rounded-lg text-mute hover:text-paper hover:bg-white/[0.04] transition-colors">
                    <i class="fas fa-cash-register w-4 text-center text-[13px]"></i>
                    <span class="text-[13.5px] font-medium">Kasir</span>
                </a>
                <a href="products.html" class="group flex items-center gap-3 pl-3.5 pr-3 py-2.5 rounded-lg text-mute hover:text-paper hover:bg-white/[0.04] transition-colors">
                    <i class="fas fa-box w-4 text-center text-[13px]"></i>
                    <span class="text-[13.5px] font-medium">Produk</span>
                </a>
                <a href="transactions.html" class="group flex items-center gap-3 pl-3.5 pr-3 py-2.5 rounded-lg text-mute hover:text-paper hover:bg-white/[0.04] transition-colors">
                    <i class="fas fa-receipt w-4 text-center text-[13px]"></i>
                    <span class="text-[13.5px] font-medium">Transaksi</span>
                </a>
                <a href="reports.html" class="group flex items-center gap-3 pl-3.5 pr-3 py-2.5 rounded-lg relative text-paper bg-white/[0.06]">
                    <span class="absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-5 bg-brasslight rounded-full"></span>
                    <i class="fas fa-chart-bar w-4 text-center text-brasslight text-[13px]"></i>
                    <span class="text-[13.5px] font-medium">Laporan</span>
                </a>
                <a href="settings.html" class="group flex items-center gap-3 pl-3.5 pr-3 py-2.5 rounded-lg text-mute hover:text-paper hover:bg-white/[0.04] transition-colors">
                    <i class="fas fa-cog w-4 text-center text-[13px]"></i>
                    <span class="text-[13.5px] font-medium">Pengaturan</span>
                </a>
            </nav>

            <div class="h-px bg-white/[0.08] mx-5"></div>

            <div class="px-5 py-4">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-white/[0.06] border border-white/10 flex items-center justify-center shrink-0">
                        <i class="fas fa-store text-brasslight text-[11px]"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[13px] font-semibold text-paper truncate leading-tight" id="storeNameSidebar">Toko Saya</p>
                        <p class="text-[11px] text-mute leading-tight">Admin</p>
                    </div>
                    <span id="appVersionBadge" class="text-[10px] text-mute font-mono shrink-0 px-1.5 py-0.5 rounded bg-white/[0.05]"></span>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="lg:ml-64 min-h-screen">
            <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-200 px-6 py-4 flex items-center justify-between no-print">
                <div class="flex items-center gap-4">
                    <button @click="sidebarOpen = true" class="lg:hidden p-2 rounded-lg hover:bg-gray-200">
                        <i class="fas fa-bars text-gray-600"></i>
                    </button>
                    <div class="flex items-center gap-2 text-gray-500">
                        <i class="fas fa-store"></i>
                        <span class="font-medium" id="storeNameTopbar">Toko Saya</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:flex items-center gap-2 text-sm text-gray-500 bg-white px-3 py-1.5 rounded-lg border">
                        <i class="fas fa-clock"></i>
                        <span id="liveClock">--</span>
                    </div>
                    <button onclick="exportAll()" class="p-2 rounded-lg hover:bg-gray-200 text-gray-600" title="Export Data">
                        <i class="fas fa-download"></i>
                    </button>
                </div>
            </header>

            <div class="p-6">

                <div x-data="reportsApp()" x-init="init()">
                    <div class="mb-6">
                        <h2 class="text-2xl font-bold text-gray-800">Laporan</h2>
                        <p class="text-gray-500">Analisis penjualan dan performa</p>
                    </div>

                    <div class="flex gap-3 mb-6">
                        <select x-model="period" @change="generate()" class="px-4 py-2.5 rounded-xl border border-gray-200 focus:border-indigo-500 outline-none bg-white">
                            <option value="today">Hari Ini</option>
                            <option value="week">7 Hari Terakhir</option>
                            <option value="month">30 Hari Terakhir</option>
                            <option value="all">Semua Waktu</option>
                        </select>
                        <button @click="generate()" class="px-4 py-2.5 rounded-xl border border-gray-200 hover:bg-gray-50"><i class="fas fa-sync text-gray-600"></i></button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center mb-3"><i class="fas fa-shopping-bag text-white"></i></div>
                            <p class="text-2xl font-bold" x-text="stats.sales"></p>
                            <p class="text-sm text-gray-500">Total Penjualan</p>
                        </div>
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-400 to-red-500 flex items-center justify-center mb-3"><i class="fas fa-money-bill-wave text-white"></i></div>
                            <p class="text-2xl font-bold" x-text="fmt.rupiah(stats.revenue)"></p>
                            <p class="text-sm text-gray-500">Total Pendapatan</p>
                        </div>
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-cyan-400 to-indigo-500 flex items-center justify-center mb-3"><i class="fas fa-boxes text-white"></i></div>
                            <p class="text-2xl font-bold" x-text="stats.items"></p>
                            <p class="text-sm text-gray-500">Item Terjual</p>
                        </div>
                        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-400 to-cyan-400 flex items-center justify-center mb-3"><i class="fas fa-chart-pie text-white"></i></div>
                            <p class="text-2xl font-bold" x-text="fmt.rupiah(stats.avg)"></p>
                            <p class="text-sm text-gray-500">Rata-rata Transaksi</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                            <h3 class="font-bold text-lg mb-4 flex items-center gap-2"><i class="fas fa-fire text-red-500"></i> Produk Terlaris</h3>
                            <div class="space-y-3" x-show="topProducts.length">
                                <template x-for="(item, i) in topProducts.slice(0,5)" :key="i">
                                    <div class="flex items-center gap-3 p-3 rounded-xl bg-gray-50">
                                        <div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-sm" x-text="i+1"></div>
                                        <div class="flex-1 min-w-0">
                                            <p class="font-medium truncate" x-text="item.name"></p>
                                            <p class="text-xs text-gray-500" x-text="item.qty + ' terjual'"></p>
                                        </div>
                                        <span class="font-bold text-indigo-600" x-text="fmt.rupiah(item.revenue)"></span>
                                    </div>
                                </template>
                            </div>
                            <p x-show="!topProducts.length" class="text-gray-400 text-center py-8">Tidak ada data</p>
                        </div>
                        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                            <h3 class="font-bold text-lg mb-4 flex items-center gap-2"><i class="fas fa-list text-cyan-500"></i> Detail Penjualan per Produk</h3>
                            <div class="space-y-2 max-h-80 overflow-y-auto scrollbar-hide" x-show="topProducts.length">
                                <template x-for="item in topProducts" :key="item.id">
                                    <div class="flex items-center justify-between p-3 rounded-xl bg-gray-50">
                                        <div class="flex-1 min-w-0">
                                            <p class="font-medium text-sm truncate" x-text="item.name"></p>
                                            <div class="w-full bg-gray-200 rounded-full h-1.5 mt-1">
                                                <div class="bg-indigo-500 h-1.5 rounded-full transition-all" :style="'width: ' + (item.qty / Math.max(...topProducts.map(p => p.qty)) * 100) + '%'"></div>
                                            </div>
                                        </div>
                                        <div class="text-right ml-4">
                                            <p class="font-bold text-sm" x-text="fmt.rupiah(item.revenue)"></p>
                                            <p class="text-xs text-gray-500" x-text="item.qty + ' pcs'"></p>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <p x-show="!topProducts.length" class="text-gray-400 text-center py-8">Tidak ada data</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
        // Live clock
        function updateClock() {
            const el = document.getElementById('liveClock');
            if (el) el.textContent = new Date().toLocaleString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Sync store name
        const settings = DB.get('settings', {});
        if (settings.storeName) {
            document.getElementById('storeNameTopbar').textContent = settings.storeName;
            document.getElementById('storeNameSidebar').textContent = settings.storeName;
        }
        });
    </script>
</body>
</html>
